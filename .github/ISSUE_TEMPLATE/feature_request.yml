name: Feature Request
description: Suggest a new feature or enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check that it hasn't already been requested.
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear description of what you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: How would this feature improve your experience? What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area of the app does this relate to?
      options:
        - Browse / Library
        - Playback / Player
        - Search / Discovery
        - Settings / Configuration
        - Seerr Integration
        - UI / Theming
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you thought of alternative approaches or workarounds?
